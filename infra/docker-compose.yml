# Local test stack: throwaway Redmine, Mosquitto broker, Mailpit SMTP catcher.
# Never point this at production Redmine.
name: eco

services:
  redmine:
    image: redmine:5
    ports:
      - "3000:3000"
    environment:
      REDMINE_SECRET_KEY_BASE: local-dev-only-secret-key-base-change-me
    volumes:
      - redmine-sqlite:/usr/src/redmine/sqlite
      - redmine-files:/usr/src/redmine/files
      - ./redmine:/seed:ro

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd
      - ./mosquitto/acl:/mosquitto/config/acl:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox + API

volumes:
  redmine-sqlite:
  redmine-files:
