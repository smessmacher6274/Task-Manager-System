[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco"
version = "0.1.0"
description = "Central Ecosystem server: source of truth, Redmine sync, MQTT tablet bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "paho-mqtt>=2.0",
    "python-redmine>=2.5",
    "argon2-cffi>=23.1",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["eco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "redmine: needs the local Redmine from infra/docker-compose.yml",
    "mqtt: needs the local Mosquitto from infra/docker-compose.yml",
]
